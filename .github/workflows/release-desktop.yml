name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest

    env:
      APP_URL: http://127.0.0.1:13100
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:15432/gitclaw

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Install root dependencies
        run: npm ci

      - name: Build standalone Next.js bundle
        run: npm run desktop:build:next

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Package desktop app
        run: npm run dist --prefix desktop

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: release/desktop/*
          if-no-files-found: error

  prepare-downloads:
    name: Prepare website downloads
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect installers
        run: |
          mkdir -p release/desktop
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            ! -name '*.blockmap' \
            -exec cp {} release/desktop/ \;

      - name: Build downloads manifest
        run: node desktop/scripts/prepare-website-downloads.mjs

      - name: Upload website downloads
        uses: actions/upload-artifact@v4
        with:
          name: website-downloads
          path: public/downloads/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, prepare-downloads]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
